# Shared by radiance_v1 and radiance_v2. Per-keyboard settings go in radiance_v1.conf / radiance_v2.conf.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_WPM=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
#CONFIG_USB_DEVICE_MANUFACTURER="Jonas"
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Connection settings planned to become ZMK defaults, for more stable Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Display: custom status screen (src/status_screen.c)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# Display stays on while USB powered, blanks on idle on battery (src/display_usb_awake.c)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_RADIANCE_DISPLAY_ON_USB=y
