# Shared by radiance_v1 and radiance_v2. Per-keyboard settings go in radiance_v1.conf / radiance_v2.conf.
# The encoders use src/encoder.c, which decodes every edge in the interrupt; ZMK's EC11 driver
# decodes later on the work queue and drops steps on fast turns. The display gets its own queue so
# redraws don't hold up the rest of the firmware.
CONFIG_EC11=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
#CONFIG_USB_DEVICE_MANUFACTURER="Jonas"
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Connection settings planned to become ZMK defaults, for more stable Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Allow 16-character names ("Hannes' Radiance"): ZMK's advertisement is 13 bytes + 2 + name,
# so 16 characters fill the 31-byte packet exactly. Zephyr's own check needs a limit above the length.
CONFIG_BT_DEVICE_NAME_MAX=17
# Room for a fast volume flick (2 reports per detent); the default of 5 drops the oldest ones,
# which the host then never sees while the screen still counts them.
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=40

# Display: custom status screen (src/status_screen.c)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# Display stays on while USB powered, blanks on idle on battery (src/display_usb_awake.c)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_RADIANCE_DISPLAY_ON_USB=y

# Encoder 1 scrolls like a mouse wheel (needs re-pairing over Bluetooth after first flash)
CONFIG_ZMK_POINTING=y
