on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  # ZMK bundles every build into one firmware.zip; publish each .uf2 on its own instead
  split:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
      - uses: actions/upload-artifact@v7
        with:
          path: radiance-original.uf2
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: radiance-hannes-iso-de.uf2
          archive: false
      - name: Remove the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "firmware") | .id')
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
